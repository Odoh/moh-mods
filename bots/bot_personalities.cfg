# Bot personalities for OpenMoHAA (custom build)
# Each [Name] section is one bot. Bots added without a name take these names in order.
# Keys (all optional):
#   style         label shown in the server log
#   weapon        auto | rifle | smg | mg | sniper | shotgun | heavy
#   spread        aim error multiplier, lower = more accurate (default 1.0)
#   react_min     ms before firing at a newly seen enemy (default 200)
#   react_mult    multiplier on the extra distance-based reaction delay (default 1.0)
#   turn          turn speed multiplier (default 1.0)
#   aggression    0..1 chance per fight to chase instead of holding position (default 0.5)
#   curiosity     multiplier on the chance to investigate sounds (default 1.0)
#   revenge       0..1 chance to return to where it was killed (default 0.2)
#   fire_min / fire_rand    ms of continuous fire before pausing (default 500 / 1500)
#   burst_min / burst_rand  ms pause between bursts (default 100 / 500)
#   taunt_chance  0..1 chance to taunt after a kill (default 0.2)
#   death_chance  0..1 chance to say a death line (default 0.1)
#   kill_line / death_line  chat lines, repeat the key for more lines
# Changes are picked up on the next map load.

